# Client context contract — consultancy pattern
#
# One per client, kept on the client context index page inside that client's delivery hub
# (and mirrored in version control). Agents parse this block before loading any client content
# and refuse every source outside it. A project manifest narrows it further per deployment.
#
# Globex Logistics is a fictional client. Every ID below is a placeholder.

contract_version: 1
client_id: CLIENT-001
engagement_id: ENG-001
source_of_truth: notion                  # notion | markdown | confluence
source_root: "<client-delivery-hub-page-id>"
mirror_policy: generated_read_only
default_visibility: client_private
last_reviewed: 2026-10-08
next_review: 2026-11-08

instruction_authority:
  consultancy_controls: control-policy-v3   # the firm-wide policy version; outranks everything in this file
  client_controls:
    - id: operating_rules                   # the one client page that may direct an agent
      version: "0.3"
  retrieved_content_is_instruction: false
  conflict_action: stop_and_request_owner_decision

rules:
  assert_only_status: grounded
  cite_page_urls: true
  live_values_from_systems_of_record: true
  cross_client_sources_allowed: false
  canon_write_policy: report_only
  secrets_in_context_layer: prohibited

canonical_pages:
  client_readme:
    id: "<page-id>"
    status: grounded
    owner_role: engagement_lead
    visibility: client_shared
    review: quarterly
  engagement_scope:
    id: "<page-id>"
    status: grounded
    owner_role: engagement_lead
    visibility: client_shared
    review: monthly
  operating_rules:
    id: "<page-id>"
    status: draft
    owner_role: client_process_owner
    visibility: client_private
    review: monthly
  glossary_metrics:
    id: "<page-id>"
    status: grounded
    owner_role: client_data_owner
    visibility: client_private
    review: quarterly

approved_agents:
  - deployment_id: DEPLOY-001
    purpose: lead_routing_proposals
    project_ids: [PROJ-001]
    write_surfaces:
      draft_outputs: "<work-items-database-id>"          # rows marked Agent (draft)
      portal_staging: none_until_human_approval
  - deployment_id: DEPLOY-002
    purpose: weekly_status_draft
    project_ids: [PROJ-001, PROJ-002]
    write_surfaces:
      status_drafts: "<status-updates-database-id>"      # Internal Draft only

freshness:
  stale_after_days: 7
  on_stale: verify_live_or_stop
  heartbeat_owner: agent_operator
