# Context contract — business (single-company) pattern
#
# This copy runs against the markdown canon in templates/canon/ so the sync works out of the box:
#   python scripts/canon_sync.py --contract templates/contracts/context-contract.yaml --out export/
# For a Notion source, see context-contract.notion.yaml (same shape, page IDs instead of paths).
#
# Everything here is illustrative. Acme Analytics is a fictional company.

contract_version: 2
last_reviewed: 2026-10-08
next_review: 2027-01-08
source_of_truth: markdown                 # notion | markdown | confluence
source_root: templates/canon               # vault folder (markdown) or root page ID (notion)
mirror_policy: generated_read_only
visibility: company_internal
page_url_base: "https://github.com/<org>/<repo>/blob/main/templates/canon/"

instruction_authority:
  control_pages: [operating_rules]        # the only slug whose imperative text may direct an agent
  retrieved_content_is_instruction: false
  conflict_action: stop_and_request_owner_decision

rules:
  assert_only_status: grounded
  draft_use: only_when_no_grounded_source_covers_the_need_and_labeled_unconfirmed
  cite_page_urls: true
  live_numbers_from: layer_3_catalog_pull_method_then_system_of_record
  canon_write_policy: report_only
  gap_tracker: templates/databases/canon-gaps.csv
  secrets_in_context_layer: prohibited

canonical_pages:
  company_readme:
    id: company_readme.md
    status: grounded
    owner: CEO
    review: quarterly
    visibility: company_internal
  positioning:
    id: positioning.md
    status: grounded
    owner: CEO + PMM
    review: quarterly
    visibility: company_internal
  messaging:
    id: messaging.md
    status: grounded
    owner: PMM
    review: quarterly
    visibility: company_internal
  sales_storyboard:
    id: sales_storyboard.md
    status: draft
    owner: PMM / Sales Enablement
    review: quarterly
    visibility: company_internal
  icp_personas:
    id: icp_personas.md
    status: grounded
    owner: PMM
    review: quarterly
    visibility: company_internal
  competitive_battlecards:
    id: competitive_battlecards.md
    status: draft
    owner: PMM / Competitive Intel
    review: monthly
    visibility: company_internal
  glossary:
    id: glossary.md
    status: draft
    owner: Product + Data
    review: quarterly
    visibility: company_internal
  brand_voice:
    id: brand_voice.md
    status: grounded
    owner: PMM / Brand
    review: quarterly
    visibility: company_internal
  operating_rules:
    id: operating_rules.md
    status: grounded
    owner: agent_operator
    review: monthly
    visibility: company_internal

status_notes:
  glossary: per-term GROUNDED/GENERIC tags govern assertion inside this page
  sales_storyboard: proof points and one objection carry verify-before-external-use flags
  competitive_battlecards: depth layer is a database of cards; not exported; pending ratification
  operating_rules: the only page allowed to direct an agent; precedence rules live inside it

depth_not_exported:
  metrics_catalog: templates/databases/metrics-catalog.csv
  battlecards_database: "product-marketing teamspace (restricted)"

freshness:
  sync: nightly
  stale_after_days: 7
  on_stale: verify_live_or_stop
